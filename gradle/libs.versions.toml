# firebase-auth 24.0.0부터 KTX API가 메인 아티팩트로 통합되어 -ktx 아티팩트는 더 이상 배포되지 않는다.
# 코드는 com.google.firebase.auth.* (메인 패키지)만 쓰므로 아티팩트만 교체하면 된다.
firebase-auth = { group = "com.google.firebase", name = "firebase-auth", version.ref = "firebaseAuth" }
